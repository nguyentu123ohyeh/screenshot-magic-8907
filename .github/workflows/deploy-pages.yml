name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build TanStack Start SPA
        run: npm run build

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          test -f .output/public/_shell.html

          # GitHub Pages needs a root index file.
          cp .output/public/_shell.html .output/public/index.html

          # GitHub Pages has no SPA rewrite support.
          # Its custom 404 page acts as the SPA fallback for direct URLs/refreshes.
          cp .output/public/_shell.html .output/public/404.html

          # Disable Jekyll processing.
          touch .output/public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
